# Full test stack: Wazuh Manager + Elasticsearch + MCP Server
# Usage: docker compose -f compose.test.yml up --build -d
#        Then run: bash tests/elasticsearch/run_tests.sh

name: wazuh-mcp-full-test

services:
  # ---- Wazuh Manager (real API on port 55000) ----
  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.0
    container_name: test-wazuh-manager
    hostname: wazuh.manager
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    environment:
      # Point filebeat at nothing — we don't need the Wazuh indexer
      - INDEXER_URL=https://localhost:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=admin
      - FILEBEAT_SSL_VERIFICATION_MODE=none
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - ../Cybersecurity/wazuh-config:/var/ossec/etc
      - ../Cybersecurity/wazuh-certificates/root-ca.pem:/etc/ssl/root-ca.pem:ro
      - ../Cybersecurity/wazuh-certificates/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ../Cybersecurity/wazuh-certificates/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
    ports:
      - "55000:55000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sku wazuh-wui:'MyS3cr37P450r.*-' -X POST https://localhost:55000/security/user/authenticate 2>/dev/null | grep -q token"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - test-net

  # ---- Elasticsearch (storage backend, no auth) ----
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: test-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - test-net

  # ---- Seed Elasticsearch with mock Wazuh data ----
  es-seed:
    image: curlimages/curl:latest
    container_name: test-es-seed
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./tests/elasticsearch:/data:ro
    entrypoint: ["sh", "/data/seed_elasticsearch.sh"]
    networks:
      - test-net

  # ---- MCP Server under test ----
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: test-mcp-server
    depends_on:
      es-seed:
        condition: service_completed_successfully
      wazuh-manager:
        condition: service_healthy
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "3000"
      AUTH_MODE: "none"
      LOG_LEVEL: "DEBUG"
      # Wazuh Manager — real instance
      WAZUH_HOST: "wazuh.manager"
      WAZUH_USER: "wazuh-wui"
      WAZUH_PASS: "MyS3cr37P450r.*-"
      WAZUH_PORT: "55000"
      WAZUH_VERIFY_SSL: "false"
      # Elasticsearch
      ELASTICSEARCH_HOST: "http://elasticsearch"
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_USER: ""
      ELASTICSEARCH_PASS: ""
      ELASTICSEARCH_VERIFY_SSL: "false"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 http://localhost:3000/health | grep -q status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - test-net

networks:
  test-net:
    driver: bridge
